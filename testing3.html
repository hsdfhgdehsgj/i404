<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Resume</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function calculateGPA() {
      let score = document.getElementById("score").value;
      if (score === "") {
        alert("請輸入學期平均成績！");
        return;
      }
      score = parseFloat(score);
      let gpa = (score / 100) * 4;
      alert("你的 GPA（4.0 制）為：" + gpa.toFixed(2));
    }
  </script>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="images/man.jpg" alt="photo" width="40" height="40" class="rounded-circle me-2">
      我的履歷
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="page2.html">我的證照</a></li>
        <li class="nav-item"><a class="nav-link" href="page1.html">未來方向</a></li>
        <li class="nav-item"><a class="nav-link" href="test.html">工作經驗</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-4">

<!-- Carousel -->
<div id="carouselExampleCaptions" class="carousel slide mb-5">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="images/photo1.png" class="d-block w-100" style="height:450px;object-fit:cover;">
      <div class="carousel-caption d-none d-md-block">
        <h5>母校</h5>
        <p>實踐大學高雄校區</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="images/tqc.jpg" class="d-block w-100" style="height:450px;object-fit:cover;">
      <div class="carousel-caption d-none d-md-block">
        <h5>檢定</h5>
        <p>TQC+ 證照</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="images/job.jpg" class="d-block w-100" style="height:450px;object-fit:cover;">
      <div class="carousel-caption d-none d-md-block">
        <h5>期望工作</h5>
        <p>安全帽銷售</p>
      </div>
    </div>
  </div>
</div>

<hr>

<div class="row">

<!-- Accordion -->
<div class="col-md-8">
  <h2>經歷</h2>

  <div class="accordion" id="accordionExample">

    <!-- Item 1 -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
          小組合作與簡報經驗
        </button>
      </h2>
      <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
        <div class="accordion-body">
          <div class="card mb-3">
            <img src="images/add.jpg" class="card-img-top">
            <div class="card-body">
              <p>小組合作完成簡報，培養溝通與協調能力。</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Item 2 -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#collapseTwo">
          課堂專題經歷
        </button>
      </h2>
      <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
        <div class="accordion-body">
          <strong>模擬聯合國（Model United Nations）</strong>
          <p>擔任國家代表，進行議題研究、立場文件撰寫與辯論。</p>
        </div>
      </div>
    </div>

    <!-- Item 3 -->
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#collapseThree">
          志工經驗
        </button>
      </h2>
      <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
        <div class="accordion-body">
          擔任數位學習志工，協助學生線上學習。
        </div>
      </div>
    </div>

  </div>
</div>

<!-- GPA -->
<div class="col-md-4">
  <h2>GPA 計算</h2>
  <div class="card p-3 shadow">
    <input type="number" id="score" class="form-control mb-3" placeholder="例如：85">
    <button class="btn btn-primary" onclick="calculateGPA()">計算 GPA</button>
  </div>
</div>

</div>
</div>

</body>
</html>
